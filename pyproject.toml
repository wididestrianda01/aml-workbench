[project]
name = "aml-workbench"
version = "0.1.0"
description = "AML transaction monitoring & illicit-activity detection workbench"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "joblib>=1.6.0",
    "lightgbm>=4.7.0",
    "mlflow>=3.15.2",
    "networkx>=3.6.1",
    "numba>=0.61",
    "numpy>=2.0",
    "scikit-learn>=1.5",
    "shap>=0.49.1",
    "typer>=0.12",
]

[build-system]
requires = ["uv_build>=0.7,<1"]
build-backend = "uv_build"

[project.scripts]
aml = "aml_workbench.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest-cov>=7.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
files = ["src"]

[[tool.mypy.overrides]]
module = [
    "sklearn.*",
    "duckdb.*",
    "networkx.*",
    "lightgbm.*",
    "mlflow.*",
    "shap.*",
    "joblib.*",
    "numba.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=aml_workbench --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["src/aml_workbench"]
