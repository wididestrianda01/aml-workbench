[project]
name = "aml-workbench"
version = "0.1.0"
description = "AML Workbench — AML transaction monitoring & illicit-activity detection workbench"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "numpy>=2.0",
    "scikit-learn>=1.5",
    "typer>=0.12",
]

[build-system]
requires = ["uv_build>=0.7,<1"]
build-backend = "uv_build"

[project.scripts]
aml = "aml_workbench.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
files = ["src"]

[[tool.mypy.overrides]]
module = ["sklearn.*", "duckdb.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
